<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi malla académica | UniLendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monda:wght@400..700&family=Sixtyfour&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header>
    <nav aria-label="Principal">
      <ul>
        <li>
          <a href="../index.html">Inicio</a>
        </li>
        <li>
          <a href="malla.html" aria-current="page">Mi malla</a>
        </li>
        <li id="admin-link" hidden>
          <a href="admin.html">Administración</a>
        </li>
        <li>
          <span id="user-name"></span>
        </li>
        <li>
          <button type="button" class="link-button" id="logout">Cerrar sesión</button>
        </li>
      </ul>
    </nav>
  </header>
  <main class="app-layout">
    <h1 class="app-title">Mi malla académica</h1>
    <p class="app-message" id="app-message" role="status"></p>
    <section class="summary" aria-label="Resumen de avance">
      <div class="stat"><strong id="count-aprobadas">0</strong><span>Aprobadas</span></div>
      <div class="stat"><strong id="count-cursando">0</strong><span>Cursando</span></div>
      <div class="stat"><strong id="count-pendientes">0</strong><span>Pendientes</span></div>
    </section>
    <section class="malla" id="malla" aria-label="Malla curricular"></section>
    <aside class="activities" aria-label="Actividades">
      <h2>Mis actividades</h2>
      <form id="activity-form">
        <label for="activity-title" class="visually-hidden">Actividad</label>
        <input type="text" id="activity-title" name="title" placeholder="Ej: Entregar taller de Cálculo" required>
        <label for="activity-date" class="visually-hidden">Fecha</label>
        <input type="date" id="activity-date" name="date">
        <label for="activity-description" class="visually-hidden">Descripción</label>
        <textarea id="activity-description" name="description" rows="3" placeholder="Descripción (opcional)"></textarea>
        <button type="submit" class="btn">Agregar</button>
      </form>
      <ul id="activity-list"></ul>
    </aside>
  </main>
  <footer>
    <p>Desarrollado por Samuel Teran. Todos los derechos reservados. &copy; 2026 UniLendar.</p>
  </footer>
  <button type="button" class="chat-toggle" id="chat-toggle" aria-expanded="false" aria-controls="chat-panel">Asistente</button>
  <section class="chat-panel" id="chat-panel" aria-label="Asistente de la malla" hidden>
    <div class="chat-top">
      <strong>Asistente UniLendar</strong>
      <button type="button" class="chat-close" id="chat-close" aria-label="Cerrar el asistente">&times;</button>
    </div>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
    <div class="chat-chips" id="chat-chips"></div>
    <form class="chat-form" id="chat-form">
      <label for="chat-input" class="visually-hidden">Tu pregunta</label>
      <input type="text" id="chat-input" maxlength="300" autocomplete="off" placeholder="Pregunta sobre tu malla..." required>
      <button type="submit" class="chat-send">Enviar</button>
    </form>
  </section>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/malla.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
